    <text x="200" y="132">00e71c…</text>
    <text x="310" y="132">00b924…</text>
  </g>
  <!-- pickaxe / hash -->
  <g font-family="monospace" font-size="13" fill="#18181b" text-anchor="middle">
    <text x="200" y="195">SHA-256(SHA-256(header)) = 0000ae…</text>
  </g>
  <text x="200" y="235" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#18181b">POW_SIMULATOR</text>
  <text x="200" y="258" text-anchor="middle" font-family="monospace" font-size="11" fill="#71717a">PROOF OF WORK · DOUBLE SHA-256</text>
</svg>
