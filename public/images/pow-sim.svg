<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#fafafa"/>
  <!-- block chain -->
  <g>
    <rect x="50" y="90" width="80" height="56" rx="8" fill="#18181b"/>
    <rect x="160" y="90" width="80" height="56" rx="8" fill="#18181b"/>
    <rect x="270" y="90" width="80" height="56" rx="8" fill="#2563eb"/>
    <line x1="130" y1="118" x2="160" y2="118" stroke="#a1a1aa" stroke-width="3"/>
    <line x1="240" y1="118" x2="270" y2="118" stroke="#a1a1aa" stroke-width="3"/>
  </g>
  <g font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">
